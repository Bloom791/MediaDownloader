[package]
name = "media-downloader"
version = "0.1.0"
description = "A local desktop media utility"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util"] }
which = "7"
url = "2"
thiserror = "2"
tauri-plugin-dialog = "2.8.4"
